<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14110f" />
    <title>Stargaze Audio Lab</title>
    <style>
      :root {
        --bg: #14110f;
        --panel: #1f1a16;
        --line: #3a3029;
        --ink: #f1e6d6;
        --dim: #b29f8a;
        --amber: #f4c27a;
        --red: #e0785c;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 20px; margin: 4px 0 12px; color: var(--amber); font-weight: 600; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 10px; font-weight: 600; }
      button, select, input[type='text'], input[type='number'] {
        background: #2a231d; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--amber); }
      button.primary { background: var(--amber); color: #1b140c; border-color: var(--amber); font-weight: 600; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
      label.slider { display: grid; grid-template-columns: 92px 1fr 48px; gap: 8px; align-items: center; margin-bottom: 6px; color: var(--dim); }
      label.slider output { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
      input[type='range'] { width: 100%; accent-color: var(--amber); }
      .info { font-family: ui-monospace, 'IBM Plex Mono', monospace; font-size: 13px; white-space: pre-wrap; color: var(--ink); min-height: 140px; }
      canvas { width: 100%; height: 90px; background: #0f0c0a; border-radius: 6px; border: 1px solid var(--line); display: block; }
      .muted { color: var(--dim); font-size: 12px; }
      pre.score { max-height: 360px; overflow: auto; font-size: 11px; background: #0f0c0a; padding: 8px; border-radius: 6px; border: 1px solid var(--line); }
      @media (max-width: 480px) { main { padding: 12px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Stargaze · audio lab</h1>
      <div class="row">
        <button id="unlock" class="primary">Unlock audio</button>
        <span id="state" class="muted">AudioContext: none</span>
      </div>
      <div class="grid">
        <section>
          <h2>Radio</h2>
          <div class="row">
            <button id="power">Power</button>
            <button id="prev">◀ Station</button>
            <button id="next">Station ▶</button>
            <button id="track">Next track</button>
          </div>
          <div class="row">
            <select id="band">
              <option value="stations">Stations</option>
              <option value="tape">Tape</option>
              <option value="link">Link</option>
            </select>
            <input id="sysseed" type="number" value="1" style="width: 90px" />
            <button id="newsys">New system</button>
          </div>
          <label class="slider">Dial<input id="dial" type="range" min="87.5" max="108.5" step="0.05" value="96.5" /><output id="dialv"></output></label>
          <label class="slider">Volume<input id="vol" type="range" min="0" max="1" step="0.01" value="0.75" /><output></output></label>
          <label class="slider">Character<input id="char" type="range" min="0" max="1" step="0.01" value="0.7" /><output></output></label>
          <div class="row">
            <input id="files" type="file" accept="audio/*" multiple />
          </div>
          <div class="row">
            <input id="url" type="text" placeholder="https://… stream or audio URL" style="flex: 1; min-width: 160px" />
            <button id="link">Play link</button>
          </div>
          <div id="linkres" class="muted"></div>
        </section>
        <section>
          <h2>Now playing</h2>
          <div id="info" class="info">—</div>
          <canvas id="vu" width="600" height="90"></canvas>
        </section>
        <section>
          <h2>Listener &amp; mix</h2>
          <label class="slider">Head yaw<input id="yaw" type="range" min="-180" max="180" step="1" value="0" /><output></output></label>
          <label class="slider">Move X<input id="lx" type="range" min="-1.5" max="1.5" step="0.01" value="0" /><output></output></label>
          <label class="slider">Move Z<input id="lz" type="range" min="-1.5" max="2.5" step="0.01" value="0" /><output></output></label>
          <label class="slider">Master<input id="vmaster" type="range" min="0" max="1" step="0.01" value="1" /><output></output></label>
          <label class="slider">Music<input id="vmusic" type="range" min="0" max="1" step="0.01" value="1" /><output></output></label>
          <label class="slider">Ambience<input id="vamb" type="range" min="0" max="1" step="0.01" value="1" /><output></output></label>
          <label class="slider">SFX<input id="vsfx" type="range" min="0" max="1" step="0.01" value="1" /><output></output></label>
        </section>
        <section>
          <h2>Ship &amp; SFX</h2>
          <label class="slider">Throttle<input id="throttle" type="range" min="0" max="1" step="0.01" value="0" /><output></output></label>
          <label class="slider">Speed<input id="speed" type="range" min="0" max="1" step="0.01" value="0" /><output></output></label>
          <label class="slider">Warp<input id="warp" type="range" min="0" max="1" step="0.01" value="0" /><output></output></label>
          <div id="sfx" class="row"></div>
          <div id="stats" class="muted"></div>
        </section>
      </div>
      <section style="margin-top: 12px">
        <h2>Score of the current track</h2>
        <div class="row"><button id="score">Show score</button></div>
        <pre id="scoretext" class="score"></pre>
      </section>
    </main>
    <script type="module" src="./src/audio/lab.ts"></script>
  </body>
</html>
